# Publishes the website/ folder to GitHub Pages:
# https://e26180.github.io/ENG1-GoosePatrol-TeamN/
# Runs when the website, a deliverable or the game changes on main, or by hand from the Actions tab.
# The PDFs are copied from docs/ and the game JAR is built from the code at build time,
# so the site always offers the latest version and nothing is stored twice.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assessment1/**"
      - "docs/architecture/**"
      - "docs/plan/**"
      - "docs/testing/**"
      - "tools/md_page.py"
      - "core/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "lwjgl3/**"
      - "assets/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run the unit tests and build the game JAR
        # A failing test stops the deploy, so the website never offers a broken build.
        run: ./gradlew --no-daemon test lwjgl3:jar
      - name: Put the website and the deliverables together
        run: |
          mkdir -p _site/docs _site/architecture _site/plan
          cp -r website/. _site/
          cp docs/assessment1/*.pdf _site/docs/ 2>/dev/null || true
          cp docs/architecture/*.pdf docs/architecture/*.svg _site/architecture/
          cp docs/plan/*.svg _site/plan/
          cp lwjgl3/build/libs/GoosePatrol-1.0.0.jar _site/
          mkdir -p _site/testing
          cp -r docs/testing/images _site/testing/
          for note in docs/testing/*.md; do
            python3 tools/md_page.py "$note" "_site/testing/$(basename "$note" .md).html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
