# Publishes the website/ folder to GitHub Pages:
# https://e26180.github.io/ENG1-GoosePatrol-TeamN/
# Runs when the website or a deliverable changes on main, or by hand from the Actions tab.
# The PDFs are copied from docs/ at build time, so each file lives in one place only.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assessment1/**"
      - "docs/architecture/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Put the website and the deliverables together
        run: |
          mkdir -p _site/docs _site/architecture
          cp -r website/. _site/
          cp docs/assessment1/*.pdf _site/docs/ 2>/dev/null || true
          cp docs/architecture/*.pdf docs/architecture/*.svg _site/architecture/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
