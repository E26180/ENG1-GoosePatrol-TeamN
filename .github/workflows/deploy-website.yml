# Publishes the website/ folder to GitHub Pages:
# https://e26180.github.io/ENG1-GoosePatrol-TeamN/
# Runs when the website, a deliverable or the game changes on main, or by hand from the Actions tab.
# The PDFs are copied from docs/ and the game JAR is built from the code at build time,
# so the site always offers the latest version and nothing is stored twice.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assessment1/**"
      - "docs/architecture/**"
      - "docs/plan/**"
      - "docs/testing/**"
      - "tools/md_page.py"
      - "core/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "lwjgl3/**"
      - "assets/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run the unit tests and build the game JAR
        # A failing test stops the deploy, so the website never offers a broken build.
        run: ./gradlew --no-daemon test lwjgl3:jar
      - name: Put the website and the deliverables together
        run: |
          # every folder is optional, so the site still builds while documents are being rewritten
          mkdir -p _site/docs _site/architecture _site/plan _site/testing
          cp -r website/. _site/
          cp docs/assessment1/*.pdf _site/docs/ 2>/dev/null || true
          # the team's diagrams, CRC cards and plan snapshots: every file in these folders is published
          # and listed in files.json, which architecture.html and plan.html read to show them
          for folder in architecture plan; do
            if [ -d "docs/$folder" ]; then find "docs/$folder" -maxdepth 1 -type f ! -name '.*' -exec cp {} "_site/$folder/" \; ; fi
            python3 -c 'import json, os, sys; d = sys.argv[1]; print(json.dumps(sorted(f for f in os.listdir(d) if f != "files.json")))' "_site/$folder" > "_site/$folder/files.json"
          done
          cp lwjgl3/build/libs/GoosePatrol-1.0.0.jar _site/
          if [ -d docs/testing/images ]; then cp -r docs/testing/images _site/testing/; fi
          for note in docs/testing/*.md; do
            [ -e "$note" ] || continue
            python3 tools/md_page.py "$note" "_site/testing/$(basename "$note" .md).html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
