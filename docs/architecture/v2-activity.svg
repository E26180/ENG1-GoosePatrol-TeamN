ked?</text><polygon points="300,652.0 395.0,680 300,708.0 205.0,680" fill="#fde6cc" stroke="#c9962c" stroke-width="1.3"/><text x="300" y="677.0" text-anchor="middle" font-size="11.5" fill="#111">Item ready and</text><text x="300" y="690.0" text-anchor="middle" font-size="11.5" fill="#111">target found?</text><rect x="90.0" y="737.0" width="420" height="46" rx="8" fill="#f4d4d2" stroke="#a06a66" stroke-width="1.3"/><text x="300" y="750.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Inventory System</text><text x="300" y="764.0" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111">apply the item effect (feed geese, speed boost)</text><text x="300" y="778.0" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111">Counter System: items + 1</text><rect x="150.0" y="812.0" width="300" height="36" rx="8" fill="#e6e0f0" stroke="#7a6a90" stroke-width="1.3"/><text x="300" y="827.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Time Limit System</text><text x="300" y="841.0" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111">update the timer</text><polygon points="300,868.0 385.0,895 300,922.0 215.0,895" fill="#fde6cc" stroke="#c9962c" stroke-width="1.3"/><text x="300" y="892.0" text-anchor="middle" font-size="11.5" fill="#111">All geese</text><text x="300" y="905.0" text-anchor="middle" font-size="11.5" fill="#111">satisfied?</text><polygon points="300,937.0 375.0,960 300,983.0 225.0,960" fill="#fde6cc" stroke="#c9962c" stroke-width="1.3"/><text x="300" y="963.5" text-anchor="middle" font-size="11.5" fill="#111">Time left?</text><rect x="515.0" y="872.0" width="270" height="46" rx="8" fill="#d9e4f6" stroke="#6a7fa8" stroke-width="1.3"/><text x="650" y="892.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Game Manager: state = won</text><text x="650" y="906.0" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111">UI System: show the win s