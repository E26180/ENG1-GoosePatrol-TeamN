<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1030" font-family="Arial, Helvetica, sans-serif"><rect width="860" height="1030" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/></marker></defs><circle cx="300" cy="22" r="11" fill="#000"/><rect x="120.0" y="52.0" width="360" height="46" rx="8" fill="#e6e0f0" stroke="#7a6a90" stroke-width="1.3"/><text x="300" y="65.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Game Manager</text><text x="300" y="79.0" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111">initialise: 2 items in the inventory,</text><text x="300" y="93.0" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111">counters = 0, timer 5:00</text><rect x="120.0" y="120.0" width="360" height="40" rx="8" fill="#f4d4d2" stroke="#a06a66" stroke-width="1.3"/><text x="300" y="137.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">UI System</text><text x="300" y="151.0" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111">show the pause screen (the game starts paused)</text><rect x="120.0" y="185.0" width="360" height="40" rx="8" fill="#e6e0f0" stroke="#7a6a90" stroke-width="1.3"/><text x="300" y="202.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Player Control System</text><text x="300" y="216.0" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111">read input: WASD, mouse, keys 1-9, pause key</text><polygon points="300,248.0 375.0,275 300,302.0 225.0,275" fill="#fde6cc" stroke="#c9962c" stroke-width="1.3"/><text x="300" y="278.5" text-anchor="middle" font-size="11.5" fill="#111">Paused?</text><rect x="495.0" y="249.0" width="250" height="52" rx="8" fill="#d9e4f6" stroke="#6a7fa8" stroke-width="1.3"/><text x="620" y="265.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#11