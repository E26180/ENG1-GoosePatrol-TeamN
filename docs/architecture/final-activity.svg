<text x="380" y="116.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">load the Tiled map, put the player on a free spot,</text>
<text x="380" y="133.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">place 2 hidden events, inventory = Oats + Bread, state = READY</text>
