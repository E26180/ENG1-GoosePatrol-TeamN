<rect width="1040" height="1020" fill="#fff"/>
<text x="520.0" y="26" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle" fill="#222">Final activity diagram (v3): GameScreen.render(delta), once per frame</text>
